# Página de manutenção atrás do proxy das aplicações.
# Qualquer rota, exceto arquivos da página e /healthz, responde 503
# com este HTML. O proxy externo precisa repassar status e corpo
# (no nginx de borda: proxy_intercept_errors off) e não cachear.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    charset utf-8;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Notícias recentes do site institucional. Se o site não responder,
    # a página usa html/destaques.json.
    location = /linha-noticias {
        resolver 127.0.0.11 ipv6=off valid=300s;
        set $linea_host www.linea.org.br;
        proxy_pass https://$linea_host/admin/wp-json/wp/v2/posts?categories=299&per_page=6&_fields=date,slug,title,excerpt;
        proxy_ssl_server_name on;
        proxy_ssl_name www.linea.org.br;
        proxy_http_version 1.1;
        proxy_set_header Host www.linea.org.br;
        proxy_set_header Accept application/json;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Link;
        proxy_hide_header X-WP-Total;
        proxy_hide_header X-WP-TotalPages;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
    }

    location = /content.json {
        try_files /content.json =404;
    }

    location ^~ /images/ {
        try_files $uri =404;
    }

    # /styles.css e também /qualquer/rota/styles.css apontam para o arquivo na raiz.
    location ~* /([^/]+\.(?:css|js|json|svg|ico))$ {
        try_files /$1 =404;
    }

    error_page 503 /index.html;

    location = /index.html {
        internal;
        ssi on;
    }

    location / {
        return 503;
    }
}
