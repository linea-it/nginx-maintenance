# Página de manutenção atrás do proxy das aplicações.
# Qualquer rota, exceto arquivos da página e /healthz, responde 503
# com este HTML. O proxy externo precisa repassar status e corpo
# (no nginx de borda: proxy_intercept_errors off) e não cachear.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    charset utf-8;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        alias /usr/share/nginx/html/images/favicon.png;
        default_type image/png;
    }

    location = /content.json {
        try_files /content.json =404;
    }

    location ^~ /images/ {
        try_files $uri =404;
    }

    # /styles.css e também /qualquer/rota/styles.css apontam para o arquivo na raiz.
    location ~* /([^/]+\.(?:css|js|json|svg|ico))$ {
        try_files /$1 =404;
    }

    location ~* /images/([^/]+\.(?:png|jpe?g|gif|webp|svg|ico))$ {
        try_files /images/$1 =404;
    }

    error_page 503 /index.html;

    location = /index.html {
        internal;
        ssi on;
    }

    location / {
        return 503;
    }
}
