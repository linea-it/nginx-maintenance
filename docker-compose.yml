services:
  web:
    image: nginx:alpine
    container_name: ${CONTAINER_NAME:-nginx-maintenance}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-7777}:80"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      # Texto desta instância. O arquivo precisa existir antes de descomentar;
      # se não existir, o Docker cria uma pasta e a subida seguinte quebra.
      # - ./conteudo/portal.json:/usr/share/nginx/html/content.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
